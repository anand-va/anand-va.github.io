</script>

<body>

<main>
  <a class="logo" href="/" style="color:inherit;text-decoration:none" aria-label="Home">av<span>_</span></a>

  <h1 class="visually-hidden">Resume of Anand V A</h1>

  <div class="line page-prompt" aria-hidden="true"><a href="/"><span class="ps1"><span class="arrow">&#10140;</span>&nbsp; <span class="dir">~</span></span></a> mdv RESUME.md</div>

  <div class="output md" id="resume">
    <p class="muted">loading&hellip; if this doesn't load, <a href="/resume.pdf">open the PDF</a>.</p>
  </div>

  <div class="pdf-bar">
    <span class="muted">resume.pdf</span>
    <a href="/resume.pdf" target="_blank" rel="noopener">view</a>
    <a href="/resume.pdf" download="Anand_VA_Resume.pdf">download</a>
    <a href="/">cd ~</a>
  </div>
</main>

<footer>
  <span>&copy; 2026</span>
  <span class="sep">/</span>
  <span><time id="clock">--:--</time> in Bengaluru</span>
  <span class="sep">/</span>
  <button id="theme" type="button">theme: <span id="theme-name">auto</span></button>
</footer>

<script src="/md.js"></script>
<script>
  // render RESUME.md, minus its own PDF section (the bar below covers it)
  fetch('/RESUME.md', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (text) {
      text = text.replace(/\n## PDF[\s\S]*$/, '\n');
      document.getElementById('resume').innerHTML = MD.render(text);
    })
    .catch(function () {});

  var clock = document.getElementById('clock');
  function tick() {
    clock.textContent = new Date().toLocaleTimeString('en-GB', {
      hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata'
    });
  }
  tick();
  setInterval(tick, 15000);

  var root = document.documentElement;
  var label = document.getElementById('theme-name');
  var names = { light: 'latte', dark: 'mocha' };
  function current() {
    return root.dataset.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  label.textContent = names[current()];
  document.getElementById('theme').addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    label.textContent = names[next];
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
</script>
</body>
</html>
